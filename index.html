<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="#">🛍️ ShopEase</a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <input class="form-control form-control-sm search-box" type="search" id="searchInput" placeholder="Search products..."/>
        <button class="btn btn-outline-light position-relative" onclick="toggleCart()">
          <i class="bi bi-cart3"></i>
          <span class="badge bg-danger cart-badge" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero text-white text-center d-flex align-items-center justify-content-center">
    <div>
      <h1 class="display-5 fw-bold">Shop the Latest Trends</h1>
      <p class="lead">Quality products at unbeatable prices</p>
      <a href="#products" class="btn btn-warning btn-lg px-4">Shop Now</a>
    </div>
  </section>

  <!-- Category Filter -->
  <div class="container my-4" id="products">
    <div class="d-flex flex-wrap gap-2 justify-content-center" id="categoryFilter"></div>
  </div>

  <!-- Product Grid -->
  <div class="container mb-5">
    <div class="row g-4" id="productGrid"></div>
  </div>

  <!-- Cart Sidebar -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <div class="cart-sidebar" id="cartSidebar">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0">Your Cart</h5>
      <button class="btn btn-sm btn-outline-secondary" onclick="toggleCart()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer mt-3">
      <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
        <span>Total</span>
        <span id="cartTotal">$0.00</span>
      </div>
      <button class="btn btn-success w-100" onclick="checkout()">Checkout</button>
      <button class="btn btn-outline-danger w-100 mt-2" onclick="clearCart()">Clear Cart</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast align-items-center text-white bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastMsg">Added to cart!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <small>&copy; 2025 ShopEase. All rights reserved.</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
